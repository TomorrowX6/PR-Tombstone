services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pr_tombstone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_tombstone"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: .
    environment: &app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pr_tombstone?sslmode=disable
      HTTP_ADDR: ":8080"
      GITHUB_APP_ID: ${GITHUB_APP_ID:-0}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-rules}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${SERVER_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s
  worker:
    build: .
    entrypoint: ["/worker"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build: ./web
    depends_on:
      server: { condition: service_healthy }
    ports: ["${WEB_PORT:-5173}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
