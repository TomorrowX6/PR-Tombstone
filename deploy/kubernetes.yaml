apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-tombstone
data:
  HTTP_ADDR: ":8080"
  GITHUB_API_BASE_URL: "https://api.github.com"
  PUBLIC_BASE_URL: "https://HOST"
  AI_PROVIDER: "rules"
  EMBEDDING_PROVIDER: "local"
  JOB_POLL_INTERVAL: "2s"
  RETENTION_DAYS: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: pr-tombstone
type: Opaque
stringData:
  DATABASE_URL: "postgres://TOKEN@HOST:PORT/pr_tombstone?sslmode=require"
  GITHUB_APP_ID: "TARGET"
  GITHUB_APP_SLUG: "TARGET"
  GITHUB_PRIVATE_KEY: "TOKEN"
  GITHUB_WEBHOOK_SECRET: "TOKEN"
  DASHBOARD_TOKEN: "TOKEN"
  AI_BASE_URL: ""
  AI_API_KEY: ""
  AI_MODEL: ""
  EMBEDDING_BASE_URL: ""
  EMBEDDING_API_KEY: ""
  EMBEDDING_MODEL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-tombstone-server
spec:
  replicas: 2
  selector:
    matchLabels: { app: pr-tombstone-server }
  template:
    metadata:
      labels: { app: pr-tombstone-server }
    spec:
      containers:
        - name: server
          image: pr-tombstone:v1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: pr-tombstone }
            - secretRef: { name: pr-tombstone }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-tombstone-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: pr-tombstone-worker }
  template:
    metadata:
      labels: { app: pr-tombstone-worker }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: pr-tombstone:v1.0.0
          command: ["/worker"]
          envFrom:
            - configMapRef: { name: pr-tombstone }
            - secretRef: { name: pr-tombstone }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-tombstone-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: pr-tombstone-web }
  template:
    metadata:
      labels: { app: pr-tombstone-web }
    spec:
      containers:
        - name: web
          image: pr-tombstone-web:v1.0.0
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: { app: pr-tombstone-server }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: pr-tombstone-web
spec:
  selector: { app: pr-tombstone-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-tombstone
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: pr-tombstone-web, port: { name: http } }
